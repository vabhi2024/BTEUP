<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>BTEUP Home</title>
  </head>
<body>
    <!-- Header -->
    <header>
        <div class="logo"><i class="fa fa-graduation-cap"></i> BTEUP</div>
        <nav>
           <button class="login" onclick="openPopup()">Login</button>
            <button class="menu-btn" onclick="openMenu()"><i class="fa fa-bars"></i></button>
         </nav>
    </header>
 
  <br>
  <br>
  <br>
    
    <style>        

 * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins';  
  }
  
body, html {
    color: #000;
    height: auto;
    background: url("bg.svg");
  background-repeat: no-repeat;
  background-attachment: fixed;
  background-size: cover;
}
/* Header */

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 10px;
    background: #fff;
    color: red;
    z-index: 1000;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
}

.logo {
   color: black;
    font-size: 20px;
    font-weight: bold;
    font-family: 'Poppins';
}

nav {
    display: flex;
    align-items: center;
}

.btn, .menu-btn {
    background: none;
    color: black;
    border: none ;
    margin: 6px;
    font-size: 22px;
    cursor: pointer;
    font-family: 'Poppins';
    border-radius: 50px;
    text-decoration: none;
}

.login { 
   background: none;
    color: black;
    border: none ;
    margin: 10px;
    font-size: 17px;
    cursor: pointer;
    font-weight: 600;
    font-family: 'Poppins';
    border-radius: 50px;
    text-decoration: none;
}    
        /* Main Hero Section */
        .hero-container {
            display: flex;
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            align-items: center;
            justify-content: space-between;
        }

        .content-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
          }

        /* The Tilted Headline */
        .headline {
            transform: rotate(-7deg);
            margin-bottom: 40px;
        }

        .highlight-text {
            display: block;
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1.1;
            color: #000;
        }

        .sub-headline {
            background: #000;
            color: #fff;
            padding: 5px 50px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 500;
            display: inline-block;
            margin-top: 5px;
        }

        /* Download Button */
        .download-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 18px 45px;
            border-radius: 12px;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        .download-btn:hover {
            background: #0056b3;
            transform: scale(1.05);
        }

       h6 {
            margin-top: 25px;
            color: darkblue;
            font-weight: 500;
            font-size: 0.8rem;
            line-height: 1.4;
       }

        .approval-text {
            margin-top: 25px;
            color: #666;
            font-size: 0.9rem;
            line-height: 1.4;
        }
/* Footer (Fixed at Bottom) */

footer {
   position: fixed;
   bottom: 0;
    width: 100%;
    background: darkslategray;
    color: white;
    font-family: 'open sans';
    font-weight: 550;
    text-align: center;
    padding: 15px;
    margin-top: 10px;
}

footer .text {
   text-decoration: none;
   color: white;
   font-size: 13px;
   font-weight: 550;
   }

footer a {
   text-decoration: none;
   color: lime;
   font-weight: 550
   margin-bottom: -10px;
}
        
    </style>
</head>
<body>  

    <main class="hero-container">
        <div class="content-side">
            <div class="headline">
                <span class="highlight-text">Empower<br> Your Technical Journey</span>
                <span class="sub-headline">With BTEUP!</span>
            </div>

            <img src="app-icon.png" height="auto" width="200px">
            <br>
            <button class="download-btn" id="dlBtn">
                <i class="fas fa-cloud-download-alt"></i> Download App
            </button>

          <h6>Total Downloads : 500+ <span style="color:black">|</span> App Size : 4.2 MB</h6>

            <p class="approval-text">
                © Approved by - <br>
                <strong>Government Polytechnic Barabanki</strong>
            </p>
        </div>

    </main>    

   <script>
    document.getElementById('dlBtn').addEventListener('click', function() {
         const fileUrl = "bteup_official_v1.0.0.apk"; 
         window.location.href = fileUrl;
    });
</script>


</body>
</html>
    
    <br><br>
  <!-- Footer -->
    <footer>
        <p class="text">&copy; 2026 - Designed & Developed with ♥️ <a href="https://adtech2021.netlify.app/">ADTech India</a></p>
    </footer>
  <script src="a-button.js"></script>
</body>
</html>
