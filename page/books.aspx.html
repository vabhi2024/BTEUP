    <style>
      /* Each toast */
    .toast {
      position: relative;      
      background: #000;
       color: yellow;
       padding: 15px;
       width: 95%;
       border-radius: 0 0 50px 0; 
       white-space: nowrap;

      /* animation */
      opacity: 0;
      transform: translateX(-200px);
      animation: slideIn 0.4s forwards, fadeOut 0.5s forwards 1.2s;
    }

    /* Left → Center */
    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Fade out */
    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: translateX(0) scale(0.9);
      }
    }
  </style>
</head>

<body>

<div id="container"></div>
    
    <!-- Header -->

    <script>
  const links = document.querySelectorAll("a");
  const container = document.getElementById("container");

  links.forEach(link => {
    link.addEventListener("click", function(e) {
      e.preventDefault();

      // create new toast every click
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = "Available Soon!";

      container.appendChild(toast);

      // remove after animation ends
      setTimeout(() => {
        toast.remove();
      }, 1800);
    });
  });
</script>
